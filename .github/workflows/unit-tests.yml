
name: AuraKinetix Custom Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-unit-tests:
    name: Physics Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: versions/v4.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install numpy pytest pytest-cov


      - name: Run physics unit tests with coverage
        run: |
          python -m pytest tests/unit/test_physics.py -v --confcutdir=tests --junitxml=unit-test-results.xml --cov=aurasync.physics --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-unit-test-reports
          path: |
            versions/v4.2/unit-test-results.xml
            versions/v4.2/coverage.xml
          if-no-files-found: warn
