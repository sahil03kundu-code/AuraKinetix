name: AuraKinetix CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test Release Version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Identify version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          VERSION_DIR="versions/${TAG%.*}"
          if [ ! -d "$VERSION_DIR" ]; then
            echo "Version directory not found: $VERSION_DIR"
            exit 1
          fi
          echo "dir=$VERSION_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run version-appropriate tests
        working-directory: ${{ steps.version.outputs.dir }}
        shell: bash
        run: |
          if [[ "${{ steps.version.outputs.dir }}" == "versions/v4.2" ]]; then
            python -m pytest tests/unit tests/integration -q --confcutdir=tests -o addopts=
          else
            python -m unittest discover -s tests -v
          fi

  package:
    name: Package Validated Version
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create source-only release ZIP
        shell: bash
        run: |
          python tools/release_preflight.py --root . --tag "${GITHUB_REF_NAME}" --output "dist/AuraKinetix-${GITHUB_REF_NAME}.zip"

      - name: Verify source archive and write SHA-256 manifest
        shell: bash
        run: |
          python -m tools.verify_release_archive --archive "dist/AuraKinetix-${GITHUB_REF_NAME}.zip" --tag "${GITHUB_REF_NAME}" --checksum-output "dist/AuraKinetix-${GITHUB_REF_NAME}.zip.sha256"
          cd dist && sha256sum -c "AuraKinetix-${GITHUB_REF_NAME}.zip.sha256"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AuraKinetix ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
