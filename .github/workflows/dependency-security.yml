name: AuraKinetix Dependency Security and SBOM

on:
  pull_request:
    branches: [main]
    paths:
      - "versions/v4.2/**"
      - ".github/workflows/dependency-security.yml"
  push:
    branches: [main]
    paths:
      - "versions/v4.2/**"
      - ".github/workflows/dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: CPU Dependency Audit and CycloneDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: versions/v4.2
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and audit tools
        run: |
          python -m pip install --upgrade "pip==26.3" "setuptools==84.2.1"
          python -m pip install "torch==2.15.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -r requirements-ci-py311-ubuntu24.lock
      - name: Check dependency consistency and snapshot versions
        run: |
          python -m pip check
          python -m pip freeze --all > dependency-environment.freeze.txt
          python - <<'PY'
          from pathlib import Path
          expected = sorted(line for raw in Path("requirements-ci-py311-ubuntu24.lock").read_text().splitlines()
                            if (line := raw.strip()) and not line.startswith("#"))
          actual = sorted(Path("dependency-environment.freeze.txt").read_text().splitlines())
          assert expected == actual, (
              "Installed environment differs from pinned CI snapshot; inspect artifact, review and update lock explicitly."
          )
          print("Exact dependency versions match reviewed CI lock.")
          PY
          python - <<'PY'
          import json, platform, sys
          from pathlib import Path
          import importlib.metadata as m
          names = ("numpy", "scipy", "matplotlib", "torch", "pip-audit", "cyclonedx-bom")
          report = {
              "schema_version": 1,
              "python": platform.python_version(),
              "platform": platform.platform(),
              "executable": sys.executable,
              "requirements_policy": "Version ranges, not a hash-pinned lock; freeze is an environment snapshot.",
              "packages": {name: m.version(name) for name in names},
          }
          Path("dependency-environment.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Generate reproducible CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-reproducible --output-file dependency-sbom.cdx.json
      - name: Audit installed dependencies against known advisories
        run: |
          set +e
          pip-audit --format json --output dependency-audit.json
          status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("dependency-audit.json").read_text())
          findings = [(pkg["name"], pkg["version"], v["id"])
                      for pkg in report["dependencies"] for v in pkg.get("vulns", [])]
          print("Disclosed advisory IDs (not credentials):")
          for name, version, advisory in findings:
              print(name, version, advisory)
          print("Vulnerability count:", len(findings))
          PY
          exit "$status"
      - name: Validate security artifact schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("dependency-audit.json").read_text())
          sbom = json.loads(Path("dependency-sbom.cdx.json").read_text())
          env = json.loads(Path("dependency-environment.json").read_text())
          assert isinstance(audit.get("dependencies"), list)
          assert sbom["bomFormat"] == "CycloneDX"
          assert isinstance(sbom.get("components"), list) and sbom["components"]
          assert env["python"].startswith("3.11.")
          print("Dependency audit, SBOM and environment manifests validated")
          PY
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-aws-dependency-security
          path: |
            versions/v4.2/dependency-audit.json
            versions/v4.2/dependency-sbom.cdx.json
            versions/v4.2/dependency-environment.json
            versions/v4.2/dependency-environment.freeze.txt
          if-no-files-found: warn
